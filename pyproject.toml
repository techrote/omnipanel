[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipanel"
dynamic = ["version"]
description = "Operator control plane for the techrote agent-tooling ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["textual==8.2.8"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "mypy==2.3.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.7",
]

[project.scripts]
omnipanel = "omnipanel.cli:main"

[project.urls]
Repository = "https://github.com/techrote/omnipanel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "omnipanel._version.__version__"}

[tool.setuptools.package-data]
omnipanel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/omnipanel"]
strict = true
warn_unreachable = true
