name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable package and development tools
        id: install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check .
      - name: Formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff format --check --diff .
      - name: Strict source type checking
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy
      - name: Unit, boundary and headless Textual tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest --junitxml=artifacts/pytest.xml
      - name: Build source distribution and wheel
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m build
      - name: Clean wheel install outside checkout
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/check_distribution.py dist/omnipanel-*.whl
      - name: Record resolved dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          python -m pip freeze --all > artifacts/dependencies.txt
          python -VV > artifacts/python.txt
      - name: Retain test and packaging evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            artifacts/
            dist/
          retention-days: 14
          if-no-files-found: warn
